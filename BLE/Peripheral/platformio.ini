[platformio]
src_dir = ../..

[env:ch583]
platform = ch32v@1.1.0
board = genericCH583M
framework = none

build_src_filter =
    -<*>
    +<BLE/Peripheral/APP/>
    +<BLE/Peripheral/Profile/>
    +<BLE/Peripheral/Startup/>
    +<BLE/HAL/MCU.c>
    +<BLE/HAL/RTC.c>
    +<BLE/HAL/SLEEP.c>
    +<SRC/StdPeriphDriver/>
    +<SRC/RVMSIS/core_riscv.c>
    -<.git/>

board_build.ldscript = Ld/Link.ld

build_flags =
    -march=rv32imac
    -mabi=ilp32
    -msmall-data-limit=8
    -mno-save-restore
    -Os
    -ffunction-sections
    -fdata-sections
    -fstack-usage
    -fno-common
    -fsigned-char
    -fmessage-length=0
    -nostartfiles
    --specs=nano.specs
    --specs=nosys.specs
    -Wl,--gc-sections
    -Wl,--print-memory-usage
    -IAPP/include
    -IProfile/include
    -IStartup
    -I../../SRC/StdPeriphDriver/inc
    -I../HAL/include
    -I../LIB
    -I../../SRC/RVMSIS
    -L../LIB
    -L../../SRC/StdPeriphDriver
    -lCH58xBLE
    -lISP583
    # Keep the field-proven BLE controller layout from HEAD unchanged.
    # WCH reserves four bytes beyond ATT MTU: 251 permits ATT MTU 247.
    -DBLE_BUFF_MAX_LEN=251

extra_scripts = post:post_extra_script.py
upload_protocol = wch-link
debug_tool = wch-link

[env:ch583_ble_baseline]
extends = env:ch583
build_flags =
    ${env:ch583.build_flags}
    # UART1 is reserved for ML307R; diagnostic output uses UART2 PA6/PA7.
    -DDEBUG=2
    -DBLE_BASELINE_DIAGNOSTIC=1

[env:ch583_debug]
extends = env:ch583
build_flags =
    ${env:ch583.build_flags}
    -DDEBUG=2

[env:ch583_updater]
extends = env:ch583
build_src_filter =
    -<*>
    +<BLE/BackupUpgrade_IAP/APP/peripheral_main.c>
    +<BLE/BackupUpgrade_IAP/Startup/>
    +<SRC/StdPeriphDriver/>
    +<SRC/RVMSIS/core_riscv.c>
board_build.ldscript = ../BackupUpgrade_IAP/Ld/Link.ld
build_flags =
    ${env:ch583.build_flags}
    -I../BackupUpgrade_IAP/APP/include
    -I../BackupUpgrade_IAP/Startup

[env:ch583_jump]
extends = env:ch583
build_src_filter =
    -<*>
    +<BLE/BackupUpgrade_JumpIAP/Startup/startup_CH583.S>
board_build.ldscript = ../BackupUpgrade_JumpIAP/Ld/Link.ld

[env:ch583_ble_baseline_nosnv]
extends = env:ch583_ble_baseline
build_flags =
    ${env:ch583_ble_baseline.build_flags}
    -DBLE_SNV=FALSE
