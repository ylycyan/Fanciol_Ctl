;
; PlatformIO configuration for CH583 BLE Peripheral project
;

[platformio]
src_dir = F:/code/Fanciol_Ctl

[env:ch583]
platform = ch32v
board = genericCH583M
framework = none

; 源码筛选
build_src_filter =
    -<*>
    +<BLE/Peripheral/APP/>
    +<BLE/Peripheral/Profile/>
    +<BLE/Peripheral/Startup/>
    +<BLE/HAL/MCU.c>
    +<BLE/HAL/RTC.c>
    +<BLE/HAL/SLEEP.c>
    +<SRC/StdPeriphDriver/>
    +<SRC/RVMSIS/core_riscv.c>
    -<.git/>

; 使用 Peripheral 自己的链接脚本
board_build.ldscript = F:/code/Fanciol_Ctl/BLE/Peripheral/Ld/Link.ld

build_flags =
    -march=rv32imac
    -mabi=ilp32
    -msmall-data-limit=8
    -mno-save-restore
    -Os
    -ffunction-sections
    -fdata-sections
    -fno-common
    -fsigned-char
    -fmessage-length=0
    -nostartfiles
    --specs=nano.specs
    --specs=nosys.specs
    -Wl,--gc-sections
    -Wl,--print-memory-usage
    ; 头文件路径（使用绝对路径）
    -IF:/code/Fanciol_Ctl/BLE/Peripheral/APP/include
    -IF:/code/Fanciol_Ctl/BLE/Peripheral/Profile/include
    -IF:/code/Fanciol_Ctl/BLE/Peripheral/Startup
    -IF:/code/Fanciol_Ctl/SRC/StdPeriphDriver/inc
    -IF:/code/Fanciol_Ctl/BLE/HAL/include
    -IF:/code/Fanciol_Ctl/BLE/LIB
    -IF:/code/Fanciol_Ctl/SRC/RVMSIS
    ; 预编译库
    -LF:/code/Fanciol_Ctl/BLE/LIB
    -LF:/code/Fanciol_Ctl/SRC/StdPeriphDriver
    -lCH58xBLE
    -lISP583
    ; 宏定义
    -DDEBUG=1
    -DBLE_BUFF_MAX_LEN=251

extra_scripts = post:post_extra_script.py

upload_protocol = wch-link
debug_tool = wch-link
